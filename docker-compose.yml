services:
  pixol-frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - pixol-backend

  pixol-backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://pixol:pixol@postgres:5432/pixol
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-only-secret
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixol
      POSTGRES_PASSWORD: pixol
      POSTGRES_DB: pixol
    ports:
      - "5432:5432"
    volumes:
      - pixol-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pixol-postgres:
